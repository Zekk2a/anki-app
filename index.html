<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>暗記カード</title>
<style>
:root{
  --bg:#0a0a0f;--surface:#14141f;--surface2:#1e1e2e;--border:#2a2a3e;
  --text:#e0e0e8;--text-dim:#8888a0;--accent:#6c5ce7;--accent-light:#a29bfe;
  --correct:#00b894;--wrong:#e17055;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,0.4);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Kaku Gothic ProN',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.app{max-width:520px;margin:0 auto;padding:16px;min-height:100vh}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 0;margin-bottom:16px;border-bottom:1px solid var(--border)}
.header h1{font-size:18px;font-weight:600}
.header-actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface2);color:var(--text);font-size:14px;cursor:pointer;transition:all 0.15s;user-select:none}
.btn:hover{border-color:var(--accent);background:#1a1a2e}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:#5b4bd6}
.btn-correct{background:var(--correct);border-color:var(--correct);color:#fff}
.btn-correct:hover{opacity:0.85}
.btn-wrong{background:var(--wrong);border-color:var(--wrong);color:#fff}
.btn-wrong:hover{opacity:0.85}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-icon{padding:8px;width:36px;height:36px}
.btn-block{width:100%}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.deck-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;cursor:pointer;transition:border-color 0.15s}
.deck-item:hover{border-color:var(--accent)}
.deck-item-info h3{font-size:15px;margin-bottom:2px}
.deck-item-info span{font-size:12px;color:var(--text-dim)}
.deck-actions{display:flex;gap:4px}
input[type="text"],input[type="number"],textarea,select{width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;transition:border-color 0.15s;font-family:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px}
.form-group{margin-bottom:14px}
.file-drop{border:2px dashed var(--border);border-radius:var(--radius);padding:20px;text-align:center;color:var(--text-dim);font-size:13px;cursor:pointer;transition:border-color 0.15s}
.file-drop:hover,.file-drop.dragover{border-color:var(--accent);color:var(--accent-light)}
.flashcard-container{perspective:1000px;margin-bottom:20px}
.flashcard{width:100%;min-height:280px;position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform 0.5s;border-radius:var(--radius)}
.flashcard.no-transition{transition:none!important}
.flashcard.flipped{transform:rotateY(180deg)}
.flashcard-face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);gap:12px;overflow-y:auto}
.flashcard-back{transform:rotateY(180deg)}
.flashcard-face .card-text{font-size:20px;text-align:center;word-break:break-word}
.flashcard-face .card-note{font-size:13px;color:var(--text-dim);text-align:center;word-break:break-word;margin-top:4px;white-space:pre-wrap;border-top:1px solid var(--border);padding-top:8px;width:100%}
.flashcard-face img{max-width:100%;max-height:160px;border-radius:8px}
.flashcard-face audio{width:90%}
.flashcard-label{position:absolute;top:10px;left:14px;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px}
.progress-bar{width:100%;height:4px;background:var(--surface2);border-radius:2px;margin-bottom:16px;overflow:hidden}
.progress-bar-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 0.3s}
.answer-buttons{display:flex;gap:10px}
.answer-buttons .btn{flex:1;padding:14px;font-size:15px}
.session-nav{display:flex;gap:10px;margin-bottom:10px}
.session-nav .btn{flex:1}
.session-result{text-align:center}
.session-result h2{margin-bottom:12px;font-size:22px}
.result-stats{display:flex;justify-content:center;gap:32px;margin:20px 0}
.result-stat{text-align:center}
.result-stat .num{font-size:36px;font-weight:700}
.result-stat .label{font-size:12px;color:var(--text-dim)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.toggle-row span{font-size:14px}
.switch{width:44px;height:24px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;position:relative;cursor:pointer;transition:background 0.2s}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:left 0.2s}
.switch.on::after{left:22px}
.view{display:none}
.view.active{display:block}
.card-list-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:13px}
.card-list-item.selected{border-color:var(--accent);background:#1a1a2e}
.card-list-item .front-preview{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-list-item .meta-icons{display:flex;gap:4px;color:var(--text-dim);font-size:11px;margin-left:8px}
.card-list-item .card-actions{display:flex;gap:4px;margin-left:8px}
.history-dots{display:flex;gap:3px;margin-left:8px;align-items:center}
.history-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.history-dot.correct{background:var(--correct)}
.history-dot.wrong{background:var(--wrong)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:opacity 0.2s,visibility 0.2s}
.modal-overlay.active{visibility:visible;opacity:1}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:90%;max-width:480px;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal h2{font-size:17px;margin-bottom:16px}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-dim)}
.empty-state p{margin-bottom:16px}
.text-dim{color:var(--text-dim)}
.text-sm{font-size:12px}
.mt-8{margin-top:8px}
.mb-8{margin-bottom:8px}
.mb-16{margin-bottom:16px}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.select-bar{display:flex;align-items:center;gap:8px;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:8px}
.select-bar span{font-size:13px;flex:1}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- デッキ一覧 -->
  <div class="view active" id="view-decks">
    <div class="header">
      <h1>暗記カード</h1>
      <div class="header-actions">
        <button class="btn btn-primary btn-sm" id="btn-show-create-deck">+ デッキ作成</button>
      </div>
    </div>
    <div id="deck-list"></div>
  </div>

  <!-- デッキ詳細 -->
  <div class="view" id="view-deck-detail">
    <div class="header">
      <button class="btn btn-sm btn-icon" id="btn-back-to-decks">&larr;</button>
      <h1 id="deck-detail-title"></h1>
      <div class="header-actions">
        <button class="btn btn-sm" id="btn-show-import">読込</button>
        <button class="btn btn-sm btn-primary" id="btn-show-add-card">+ カード</button>
      </div>
    </div>
    <div class="panel">
      <div class="form-group">
        <label>出題数</label>
        <input type="number" id="session-count" value="10" min="1" max="999">
      </div>
      <div class="toggle-row"><span>ランダム（忘却曲線）</span><div class="switch" id="toggle-random"></div></div>
      <div class="toggle-row"><span>表裏反転モード</span><div class="switch" id="toggle-reverse"></div></div>
      <button class="btn btn-primary btn-block mt-8" id="btn-start-session">学習を開始する</button>
    </div>
    <div class="flex-between mb-8">
      <span class="text-sm text-dim" id="card-count-label">カード: 0枚</span>
      <div class="header-actions">
        <button class="btn btn-sm" id="btn-toggle-select">選択</button>
        <button class="btn btn-sm" id="btn-export">エクスポート</button>
      </div>
    </div>
    <div class="select-bar" id="select-bar" style="display:none;">
      <span id="sel-count">0件選択</span>
      <button class="btn btn-sm" id="btn-move-cards">移動</button>
      <button class="btn btn-sm btn-wrong" id="btn-delete-selected">削除</button>
      <button class="btn btn-sm" id="btn-cancel-select">取消</button>
    </div>
    <div id="card-list"></div>
  </div>

  <!-- カード追加/編集 -->
  <div class="view" id="view-add-card">
    <div class="header">
      <button class="btn btn-sm btn-icon" id="btn-cancel-add-card">&larr;</button>
      <h1 id="add-card-title">カード追加</h1>
      <div></div>
    </div>
    <div class="panel">
      <h3 class="mb-8">表面（問題）</h3>
      <div class="form-group"><label>テキスト</label><textarea id="card-front-text" placeholder="問題文を入力"></textarea></div>
      <div class="form-group"><label>画像</label><input type="file" id="card-front-image" accept="image/*"><div id="card-front-image-preview" class="mt-8"></div></div>
      <div class="form-group"><label>音声</label><input type="file" id="card-front-audio" accept="audio/*"><div id="card-front-audio-preview" class="mt-8"></div></div>
    </div>
    <div class="panel">
      <h3 class="mb-8">裏面（解答）</h3>
      <div class="form-group"><label>テキスト</label><textarea id="card-back-text" placeholder="解答を入力"></textarea></div>
      <div class="form-group"><label>画像</label><input type="file" id="card-back-image" accept="image/*"><div id="card-back-image-preview" class="mt-8"></div></div>
      <div class="form-group"><label>音声</label><input type="file" id="card-back-audio" accept="audio/*"><div id="card-back-audio-preview" class="mt-8"></div></div>
    </div>
    <div class="panel">
      <h3 class="mb-8">メモ（詳細説明）</h3>
      <div class="form-group"><label>解答表示時に併せて表示されます</label><textarea id="card-note" placeholder="補足説明、例文、語源など" style="min-height:80px"></textarea></div>
    </div>
    <button class="btn btn-primary btn-block" id="btn-save-card">保存</button>
  </div>

  <!-- 学習セッション -->
  <div class="view" id="view-session">
    <div class="header">
      <button class="btn btn-sm btn-icon" id="btn-end-session">&times;</button>
      <span id="session-progress-text">1 / 10</span>
      <div></div>
    </div>
    <div class="progress-bar"><div class="progress-bar-fill" id="session-progress-bar"></div></div>
    <div class="session-nav">
      <button class="btn btn-sm" id="btn-prev-card" disabled>&larr; 前へ</button>
    </div>
    <div class="flashcard-container">
      <div class="flashcard" id="flashcard">
        <div class="flashcard-face flashcard-front" id="fc-front">
          <span class="flashcard-label">問題</span>
          <div id="fc-front-content"></div>
        </div>
        <div class="flashcard-face flashcard-back" id="fc-back">
          <span class="flashcard-label">解答</span>
          <div id="fc-back-content"></div>
        </div>
      </div>
    </div>
    <div class="answer-buttons" id="answer-buttons" style="display:none;">
      <button class="btn btn-wrong" id="btn-answer-wrong">不正解</button>
      <button class="btn btn-correct" id="btn-answer-correct">正解</button>
    </div>
    <p class="text-sm text-dim mt-8" id="tap-hint" style="text-align:center;">カードをタップして解答を表示</p>
  </div>

  <!-- 結果 -->
  <div class="view" id="view-result">
    <div class="panel session-result">
      <h2>セッション完了</h2>
      <div class="result-stats">
        <div class="result-stat"><div class="num" style="color:var(--correct)" id="result-correct">0</div><div class="label">正解</div></div>
        <div class="result-stat"><div class="num" style="color:var(--wrong)" id="result-wrong">0</div><div class="label">不正解</div></div>
      </div>
      <div class="text-sm text-dim mb-16" id="result-accuracy"></div>
      <button class="btn btn-primary btn-block mb-8" id="btn-retry">もう一度</button>
      <button class="btn btn-block" id="btn-back-to-deck">デッキに戻る</button>
    </div>
  </div>
</div>

<!-- モーダル: デッキ作成 -->
<div class="modal-overlay" id="modal-create-deck">
  <div class="modal">
    <h2>新しいデッキ</h2>
    <div class="form-group"><label>デッキ名</label><input type="text" id="new-deck-name" placeholder="例: 英単語TOEIC"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-sm" id="btn-cancel-create-deck">取消</button>
      <button class="btn btn-sm btn-primary" id="btn-confirm-create-deck">作成</button>
    </div>
  </div>
</div>

<!-- モーダル: インポート -->
<div class="modal-overlay" id="modal-import">
  <div class="modal">
    <h2>ファイル読み込み</h2>
    <p class="text-sm text-dim mb-16">TSV/CSV/JSON対応。ファイル選択またはテキスト貼り付け。</p>
    <div class="form-group">
      <label>区切り文字（テキスト貼り付け・TSV/CSV時）</label>
      <select id="import-delimiter"><option value="tab">タブ (TSV)</option><option value="comma">カンマ (CSV)</option></select>
    </div>
    <div class="form-group">
      <div class="file-drop" id="import-drop">ファイルをドロップまたはクリックして選択</div>
      <input type="file" id="import-file" accept=".tsv,.csv,.txt,.json" style="display:none">
    </div>
    <div class="form-group">
      <label>または、テキストを直接貼り付け</label>
      <textarea id="import-paste" placeholder="ここにTSV/CSV/JSONテキストを貼り付け" style="min-height:120px"></textarea>
    </div>
    <div id="import-preview" class="text-sm mb-8"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-sm" id="btn-cancel-import">取消</button>
      <button class="btn btn-sm btn-primary" id="btn-confirm-import" disabled>読み込む</button>
    </div>
  </div>
</div>

<!-- モーダル: デッキ移動 -->
<div class="modal-overlay" id="modal-move">
  <div class="modal">
    <h2>カードを移動</h2>
    <div class="form-group"><label>移動先デッキ</label><select id="move-target-deck"></select></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-sm" id="btn-cancel-move">取消</button>
      <button class="btn btn-sm btn-primary" id="btn-confirm-move">移動</button>
    </div>
  </div>
</div>

<!-- モーダル: 確認 -->
<div class="modal-overlay" id="modal-confirm">
  <div class="modal">
    <p id="confirm-message"></p>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="btn btn-sm" id="btn-cancel-confirm">取消</button>
      <button class="btn btn-sm btn-wrong" id="btn-ok-confirm">実行</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

var DB_NAME="AnkiAppDB";
var DB_VERSION=5;
var db=null;

/* ===== IndexedDB ===== */
function openDB(){
  return new Promise(function(resolve,reject){
    var req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=function(e){
      var d=e.target.result;
      if(!d.objectStoreNames.contains("decks")){d.createObjectStore("decks",{keyPath:"id"});}
      if(!d.objectStoreNames.contains("cards")){
        var s=d.createObjectStore("cards",{keyPath:"id"});
        s.createIndex("deckId","deckId",{unique:false});
      }
    };
    req.onsuccess=function(e){db=e.target.result;resolve(db);};
    req.onerror=function(e){reject(e.target.error);};
  });
}
function dbPut(store,data){return new Promise(function(ok,ng){var t=db.transaction(store,"readwrite");t.objectStore(store).put(data);t.oncomplete=function(){ok();};t.onerror=function(e){ng(e.target.error);};});}
function dbGet(store,id){return new Promise(function(ok,ng){var t=db.transaction(store,"readonly");var r=t.objectStore(store).get(id);r.onsuccess=function(){ok(r.result);};r.onerror=function(e){ng(e.target.error);};});}
function dbGetAll(store){return new Promise(function(ok,ng){var t=db.transaction(store,"readonly");var r=t.objectStore(store).getAll();r.onsuccess=function(){ok(r.result);};r.onerror=function(e){ng(e.target.error);};});}
function dbDelete(store,id){return new Promise(function(ok,ng){var t=db.transaction(store,"readwrite");t.objectStore(store).delete(id);t.oncomplete=function(){ok();};t.onerror=function(e){ng(e.target.error);};});}
function dbGetByIndex(store,indexName,value){return new Promise(function(ok,ng){var t=db.transaction(store,"readonly");var r=t.objectStore(store).index(indexName).getAll(value);r.onsuccess=function(){ok(r.result);};r.onerror=function(e){ng(e.target.error);};});}

/* ===== ユーティリティ ===== */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function G(id){return document.getElementById(id);}
function esc(s){if(!s)return "";var d=document.createElement("div");d.textContent=s;return d.innerHTML;}
function csvEscape(s){if(!s)return "";if(s.indexOf(",")!==-1||s.indexOf('"')!==-1||s.indexOf("\n")!==-1){return '"'+s.replace(/"/g,'""')+'"';}return s;}

function showView(id){
  var views=document.querySelectorAll(".view");
  for(var i=0;i<views.length;i++){views[i].classList.remove("active");}
  G(id).classList.add("active");
}
function showModal(id){G(id).classList.add("active");}
function closeModal(id){G(id).classList.remove("active");}

/* ===== 状態変数 ===== */
var currentDeckId=null;
var editingCardId=null;
var sessionCards=[];
var sessionIndex=0;
var sessionCorrect=0;
var sessionWrong=0;
var sessionAnswered=[];
var isFlipped=false;
var importData=null;
var importSourceFileName=null;
var importSourceFormat=null;
var confirmCallback=null;
var selectMode=false;
var selectedIds={};
var tempFrontImage=null;
var tempFrontAudio=null;
var tempBackImage=null;
var tempBackAudio=null;

/* ===== Blob/DataURI変換 ===== */
function blobToDataURI(blob){
  return new Promise(function(ok){
    if(!blob){ok(null);return;}
    var r=new FileReader();
    r.onload=function(){ok(r.result);};
    r.readAsDataURL(blob);
  });
}
function dataURItoBlob(uri){
  if(!uri)return null;
  try{
    var parts=uri.split(",");
    var mime=parts[0].match(/:(.*?);/)[1];
    var b=atob(parts[1]);
    var arr=new Uint8Array(b.length);
    for(var i=0;i<b.length;i++){arr[i]=b.charCodeAt(i);}
    return new Blob([arr],{type:mime});
  }catch(e){return null;}
}
function fileToBlob(file){
  return new Promise(function(ok){
    if(!file){ok(null);return;}
    var r=new FileReader();
    r.onload=function(){ok(new Blob([r.result],{type:file.type}));};
    r.readAsArrayBuffer(file);
  });
}

/* ===== デッキ一覧 ===== */
function renderDeckList(){
  dbGetAll("decks").then(function(decks){
    if(decks.length===0){
      G("deck-list").innerHTML='<div class="empty-state"><p>デッキがありません</p><p class="text-sm text-dim">「+ デッキ作成」で始めましょう</p></div>';
      return;
    }
    var promises=[];
    for(var i=0;i<decks.length;i++){
      (function(deck){
        promises.push(dbGetByIndex("cards","deckId",deck.id).then(function(cards){return {deck:deck,count:cards.length};}));
      })(decks[i]);
    }
    Promise.all(promises).then(function(results){
      var html="";
      for(var j=0;j<results.length;j++){
        var r=results[j];
        html+='<div class="deck-item" data-id="'+esc(r.deck.id)+'">';
        html+='<div class="deck-item-info"><h3>'+esc(r.deck.name)+'</h3><span>'+r.count+'枚</span></div>';
        html+='<div class="deck-actions"><button class="btn btn-sm btn-icon deck-delete-btn" data-id="'+esc(r.deck.id)+'">&times;</button></div>';
        html+='</div>';
      }
      G("deck-list").innerHTML=html;
      var items=document.querySelectorAll(".deck-item");
      for(var k=0;k<items.length;k++){
        items[k].addEventListener("click",function(e){
          if(e.target.classList.contains("deck-delete-btn"))return;
          currentDeckId=this.dataset.id;
          showDeckDetail(currentDeckId);
        });
      }
      var delBtns=document.querySelectorAll(".deck-delete-btn");
      for(var m=0;m<delBtns.length;m++){
        delBtns[m].addEventListener("click",function(e){
          e.stopPropagation();
          var did=this.dataset.id;
          showConfirm("このデッキとカードをすべて削除しますか？",function(){

/* ===== インポート ===== */
function parseImportText(text){
  var result=null;
  try{
    var json=JSON.parse(text);
    if(Array.isArray(json)){
      importSourceFormat="json";
      result=[];
      for(var i=0;i<json.length;i++){
        var item=json[i];
        result.push({
          front:typeof item.front==="string"?item.front:(item[0]||""),
          back:typeof item.back==="string"?item.back:(item[1]||""),
          note:item.note||item[2]||"",
          frontImage:item.frontImage||null,
          frontAudio:item.frontAudio||null,
          backImage:item.backImage||null,
          backAudio:item.backAudio||null
        });
      }
    }
  }catch(ex){
    var delim=G("import-delimiter").value==="tab"?"\t":",";
    importSourceFormat=delim==="\t"?"tsv":"csv";
    var lines=text.split(/\r?\n/);
    result=[];
    for(var j=0;j<lines.length;j++){
      var line=lines[j].trim();
      if(!line)continue;
      var parts=line.split(delim);
      var f=(parts[0]||"").trim();
      var b=(parts[1]||"").trim();
      var n=(parts[2]||"").trim();
      if(f||b)result.push({front:f,back:b,note:n,frontImage:null,frontAudio:null,backImage:null,backAudio:null});
    }
  }
  return result;
}

function updateImportPreview(){

/* ===== エクスポート ===== */
function exportDeck(){
  dbGet("decks",currentDeckId).then(function(deck){
    return dbGetByIndex("cards","deckId",currentDeckId).then(function(cards){return{deck:deck,cards:cards};});
  }).then(function(data){
    var deck=data.deck;
    var cards=data.cards;
    var fmt=deck.sourceFormat||"json";
    var fname=deck.sourceFileName||(deck.name+".json");
    var promises=[];
    for(var i=0;i<cards.length;i++){
      (function(c){
        promises.push(
          Promise.all([
            blobToDataURI(c.front.imageBlob),blobToDataURI(c.front.audioBlob),
            blobToDataURI(c.back.imageBlob),blobToDataURI(c.back.audioBlob)
          ]).then(function(uris){
            return{front:c.front.text||"",back:c.back.text||"",note:c.note||"",
              frontImage:uris[0],frontAudio:uris[1],backImage:uris[2],backAudio:uris[3]};
          })
        );
      })(cards[i]);
    }
    Promise.all(promises).then(function(exportCards){
      var content,type;
      var hasMedia=exportCards.some(function(c){return c.frontImage||c.frontAudio||c.backImage||c.backAudio;});
      if(hasMedia)fmt="json";
      if(fmt==="json"){
        content=JSON.stringify(exportCards,null,2);
        type="application/json";
        if(fname.indexOf(".json")===-1)fname=fname.replace(/\.[^.]+$/,"")+".json";
      }else if(fmt==="tsv"){
        var lines=[];
        for(var j=0;j<exportCards.length;j++){
          var ec=exportCards[j];
          lines.push(ec.front+"\t"+ec.back+(ec.note?"\t"+ec.note:""));
        }
        content=lines.join("\n");
        type="text/tab-separated-values";
      }else{
        var csvLines=[];
        for(var k=0;k<exportCards.length;k++){
          var cc=exportCards[k];
          csvLines.push(csvEscape(cc.front)+","+csvEscape(cc.back)+(cc.note?","+csvEscape(cc.note):""));
        }
        content=csvLines.join("\n");
        type="text/csv";
      }
      var blob=new Blob([content],{type:type});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");
      a.href=url;a.download=fname;
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  });
}

/* ===== 学習セッション ===== */
function selectBySpacedRepetition(cards,count){
  var now=Date.now();
  var scored=[];
  for(var i=0;i<cards.length;i++){
    var c=cards[i];
    var urgency=0;
    if(c.nextReview<=now){
      urgency=10+(now-c.nextReview)/86400000;
    }else{
      urgency=1/(1+(c.nextReview-now)/86400000);
    }
    if(c.mistakeStreak>0)urgency+=(c.mistakeStreak*5);
    if(c.repetitions===0)urgency+=8;
    urgency+=Math.random()*2;
    scored.push({card:c,score:urgency});
  }
  scored.sort(function(a,b){return b.score-a.score;});
  var result=[];
  for(var j=0;j<Math.min(count,scored.length);j++){
    result.push(scored[j].card);
  }
  return result;
}

function selectSequential(cards,count,offset){
  var sorted=cards.slice().sort(function(a,b){return(a.createdAt||0)-(b.createdAt||0);});
  var len=sorted.length;
  var result=[];
  var used={};
  for(var i=0;i<count&&i<len;i++){
    var idx=(offset+i)%len;
    result.push(sorted[idx]);
    used[sorted[idx].id]=true;
  }
  var mistakes=sorted.filter(function(c){return c.mistakeStreak>0&&!used[c.id];});
  mistakes.sort(function(a,b){return b.mistakeStreak-a.mistakeStreak;});
  var extra=mistakes.slice(0,Math.min(3,mistakes.length));
  for(var j=0;j<extra.length;j++){
    result.splice(Math.min(j*3+1,result.length),0,extra[j]);
  }
  return result;
}

function startSession(){
  dbGetByIndex("cards","deckId",currentDeckId).then(function(all){
    if(all.length===0)return;
    var count=Math.min(parseInt(G("session-count").value)||10,all.length);
    var rand=G("toggle-random").classList.contains("on");
    if(rand){
      sessionCards=selectBySpacedRepetition(all,count);
      sessionIndex=0;sessionCorrect=0;sessionWrong=0;sessionAnswered=[];isFlipped=false;
      G("btn-prev-card").disabled=true;
      showView("view-session");
      renderSessionCard();
    }else{
      dbGet("decks",currentDeckId).then(function(deck){
        var offset=deck.seqOffset||0;
        sessionCards=selectSequential(all,count,offset);
        deck.seqOffset=(offset+count)%all.length;
        return dbPut("decks",deck);
      }).then(function(){
        sessionIndex=0;sessionCorrect=0;sessionWrong=0;sessionAnswered=[];isFlipped=false;
        G("btn-prev-card").disabled=true;
        showView("view-session");
        renderSessionCard();
      });
    }
  });
}

function renderSessionCard(){
  if(sessionIndex>=sessionCards.length){
    showResult();
    return;
  }
  var card=sessionCards[sessionIndex];
  var rev=G("toggle-reverse").classList.contains("on");
  var frontData=rev?card.back:card.front;
  var backData=rev?card.front:card.back;
  var noteData=card.note||"";

  /* チラ見え防止: トランジション無効で表面にリセットしてから有効に戻す */
  var fc=G("flashcard");
  fc.classList.add("no-transition");
  fc.classList.remove("flipped");
  fc.offsetHeight;/* リフロー強制 */
  fc.classList.remove("no-transition");

  isFlipped=false;
  G("answer-buttons").style.display="none";
  G("tap-hint").style.display="block";

  /* 表面 */
  var frontHtml="";
  if(frontData.text)frontHtml+='<div class="card-text">'+esc(frontData.text)+'</div>';
  if(frontData.imageBlob){var u=URL.createObjectURL(frontData.imageBlob);frontHtml+='<img src="'+u+'">';}
  if(frontData.audioBlob){var au=URL.createObjectURL(frontData.audioBlob);frontHtml+='<audio controls src="'+au+'"></audio>';}
  G("fc-front-content").innerHTML=frontHtml;

  /* 裏面 */
  var backHtml="";
  if(backData.text)backHtml+='<div class="card-text">'+esc(backData.text)+'</div>';
  if(backData.imageBlob){var u2=URL.createObjectURL(backData.imageBlob);backHtml+='<img src="'+u2+'">';}
  if(backData.audioBlob){var au2=URL.createObjectURL(backData.audioBlob);backHtml+='<audio controls src="'+au2+'"></audio>';}
  if(noteData)backHtml+='<div class="card-note">'+esc(noteData)+'</div>';
  G("fc-back-content").innerHTML=backHtml;

  /* 進捗 */
  var total=sessionCards.length;
  G("session-progress-text").textContent=(sessionIndex+1)+" / "+total;
  G("session-progress-bar").style.width=((sessionIndex+1)/total*100)+"%";

  /* 前へボタン */
  G("btn-prev-card").disabled=(sessionIndex===0);
}

function flipCard(){
  var fc=G("flashcard");
  if(isFlipped){
    fc.classList.remove("flipped");
    isFlipped=false;
    G("answer-buttons").style.display="none";
    G("tap-hint").style.display="block";
  }else{
    fc.classList.add("flipped");
    isFlipped=true;
    G("answer-buttons").style.display="flex";
    G("tap-hint").style.display="none";
  }
}

function answerCard(correct){
  var card=sessionCards[sessionIndex];
  var now=Date.now();

  if(correct){
    sessionCorrect++;
    card.repetitions=(card.repetitions||0)+1;
    card.mistakeStreak=0;
    if(card.repetitions===1){card.interval=1;}
    else if(card.repetitions===2){card.interval=6;}
    else{card.interval=Math.round((card.interval||1)*(card.easeFactor||2.5));}
    card.easeFactor=Math.max(1.3,(card.easeFactor||2.5)+0.1);
  }else{
    sessionWrong++;
    card.repetitions=0;
    card.interval=0;
    card.mistakeStreak=(card.mistakeStreak||0)+1;
    card.easeFactor=Math.max(1.3,(card.easeFactor||2.5)-0.2);
  }
  card.nextReview=now+(card.interval||0)*86400000;
  card.lastReviewed=now;
  if(!card.history)card.history=[];
  card.history.push(correct);
  if(card.history.length>20)card.history=card.history.slice(card.history.length-20);

  sessionAnswered[sessionIndex]={correct:correct};

  dbPut("cards",card).then(function(){
    sessionIndex++;
    isFlipped=false;
    renderSessionCard();
  });
}

function goToPrevCard(){
  if(sessionIndex<=0)return;

  /* 前の回答結果を取り消す */
  var prevIdx=sessionIndex-1;
  var prevAnswer=sessionAnswered[prevIdx];
  if(prevAnswer){
    if(prevAnswer.correct)sessionCorrect--;
    else sessionWrong--;
    delete sessionAnswered[prevIdx];
  }

  sessionIndex=prevIdx;
  isFlipped=false;
  renderSessionCard();
}

function endSessionEarly(){
  var answered=0;
  for(var i=0;i<sessionAnswered.length;i++){
    if(sessionAnswered[i])answered++;
  }
  if(answered>0){
    showResult();
  }else{
    showDeckDetail(currentDeckId);
  }
}

function showResult(){
  G("result-correct").textContent=sessionCorrect;
  G("result-wrong").textContent=sessionWrong;
  var total=sessionCorrect+sessionWrong;
  if(total>0){
    G("result-accuracy").textContent="正答率: "+Math.round(sessionCorrect/total*100)+"%";
  }else{
    G("result-accuracy").textContent="";
  }
  showView("view-result");
}

    importData=null;importSourceFileName=null;importSourceFormat=null;
    G("import-preview").innerHTML="";G("import-file").value="";G("import-paste").value="";
    G("btn-confirm-import").disabled=true;
    showModal("modal-import");
  });
  G("import-drop").addEventListener("click",function(){G("import-file").click();});
  G("import-drop").addEventListener("dragover",function(e){e.preventDefault();this.classList.add("dragover");});
  G("import-drop").addEventListener("dragleave",function(){this.classList.remove("dragover");});
  G("import-drop").addEventListener("drop",function(e){e.preventDefault();this.classList.remove("dragover");if(e.dataTransfer.files.length>0)processImportFile(e.dataTransfer.files[0]);});
  G("import-file").addEventListener("change",function(){if(this.files.length>0){G("import-paste").value="";processImportFile(this.files[0]);}});
  G("import-paste").addEventListener("input",function(){
    var text=G("import-paste").value.trim();
    if(!text){importData=null;G("import-preview").innerHTML="";G("btn-confirm-import").disabled=true;return;}
    importSourceFileName=null;
    importData=parseImportText(text);
    updateImportPreview();
  });
  G("btn-confirm-import").addEventListener("click",confirmImport);
  G("btn-cancel-import").addEventListener("click",function(){closeModal("modal-import");});

  /* エクスポート */
  G("btn-export").addEventListener("click",exportDeck);

  /* 選択モード */
  G("btn-toggle-select").addEventListener("click",function(){
    selectMode=!selectMode;
    selectedIds={};
    G("select-bar").style.display=selectMode?"flex":"none";
    G("btn-toggle-select").textContent=selectMode?"選択中":"選択";
    updateSelCount();
    renderCardList();
  });
  G("btn-cancel-select").addEventListener("click",function(){
    selectMode=false;selectedIds={};
    G("select-bar").style.display="none";
    G("btn-toggle-select").textContent="選択";
    renderCardList();
  });
  G("btn-delete-selected").addEventListener("click",function(){
    var ids=Object.keys(selectedIds);
    if(ids.length===0)return;
    showConfirm(ids.length+"件のカードを削除しますか？",function(){
      var p=Promise.resolve();
      for(var i=0;i<ids.length;i++){
        (function(cid){p=p.then(function(){return dbDelete("cards",cid);});})(ids[i]);
      }
      p.then(function(){
        selectMode=false;selectedIds={};
        G("select-bar").style.display="none";
        G("btn-toggle-select").textContent="選択";
        renderCardList();
      });
    });
  });
  G("btn-move-cards").addEventListener("click",showMoveModal);
  G("btn-confirm-move").addEventListener("click",confirmMove);
  G("btn-cancel-move").addEventListener("click",function(){closeModal("modal-move");});

  /* 確認モーダル */
  G("btn-ok-confirm").addEventListener("click",function(){closeModal("modal-confirm");if(confirmCallback){confirmCallback();confirmCallback=null;}});
  G("btn-cancel-confirm").addEventListener("click",function(){closeModal("modal-confirm");confirmCallback=null;});

  /* トグルスイッチ */
  G("toggle-random").addEventListener("click",function(){this.classList.toggle("on");});
  G("toggle-reverse").addEventListener("click",function(){this.classList.toggle("on");});

  /* 学習セッション */
  G("btn-start-session").addEventListener("click",startSession);
  G("flashcard").addEventListener("click",flipCard);
  G("btn-answer-correct").addEventListener("click",function(){answerCard(true);});
  G("btn-answer-wrong").addEventListener("click",function(){answerCard(false);});
  G("btn-prev-card").addEventListener("click",goToPrevCard);
  G("btn-end-session").addEventListener("click",endSessionEarly);

  /* 結果画面 */
  G("btn-retry").addEventListener("click",startSession);
  G("btn-back-to-deck").addEventListener("click",function(){showDeckDetail(currentDeckId);});
}

/* ===== 初期化 ===== */
function init(){
  bindEvents();
  openDB().then(function(){renderDeckList();});
}

if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",init);
}else{
  init();
}

})();
</script>
</body>
</html>
